spring.application.name=projectipt
server.address=127.0.0.1
server.port=8080

firewall.ssh-port=22
firewall.blocked-ports=22,3306

dashboard.log.auth-path=/var/log/auth.log
dashboard.log.journal-unit=projectipt-api
dashboard.log.tail-lines=80
# SSH: если auth.log пустой, читается journalctl -u ssh / sshd / _COMM=sshd
