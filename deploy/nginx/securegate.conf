# SecureGate — reverse proxy с Basic Auth (HTTP, для первого запуска)
# Spring Boot: http://127.0.0.1:8080
#
# После получения сертификата Let's Encrypt подключите securegate-ssl.conf
# (см. deploy/nginx/README.md)

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    # IP или домен; для доступа по IP оставьте default_server выше
    server_name your.domain.example _;

    auth_basic "SecureGate";
    auth_basic_user_file /etc/nginx/.htpasswd-securegate;

    # Ограничение по IP (опционально)
    # allow 203.0.113.10;
    # deny all;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }
}
