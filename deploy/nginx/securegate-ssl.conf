# HTTPS — подключать ПОСЛЕ certbot (когда есть сертификаты и файлы options-ssl-nginx.conf)
#
#   sudo certbot certonly --nginx -d your.domain.example
#   # или: sudo certbot --nginx -d your.domain.example
#
# Затем:
#   sudo cp securegate-ssl.conf /etc/nginx/sites-available/securegate-ssl
#   sudo ln -sf /etc/nginx/sites-available/securegate-ssl /etc/nginx/sites-enabled/
#   # в securegate.conf можно оставить :80 с редиректом на https (см. ниже)
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name your.domain.example;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name your.domain.example;

    ssl_certificate     /etc/letsencrypt/live/your.domain.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your.domain.example/privkey.pem;

    # Появляются после: sudo apt install certbot python3-certbot-nginx && sudo certbot ...
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    auth_basic "SecureGate";
    auth_basic_user_file /etc/nginx/.htpasswd-securegate;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }
}
